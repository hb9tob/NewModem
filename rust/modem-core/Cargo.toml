[package]
name = "modem-core"
version = "0.1.0"
edition = "2021"
description = "NBFM audio modem library — APSK/PSK/QPSK + LDPC WiMAX"

[dependencies]
num-complex = { workspace = true }
thiserror = { workspace = true }
modem-core-base = { path = "../modem-core-base" }
modem-framing = { path = "../modem-framing" }
realfft = "3"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
# Stable, portable SIMD with runtime AVX2 (x86_64) / NEON (aarch64) dispatch —
# used by the grouped QC-LDPC decoder's bit-exact f32 kernel (decode_soft).
pulp = "0.21"
