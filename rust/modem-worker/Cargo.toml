[package]
name = "modem-worker"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
description = "GUI-agnostic TX/RX orchestration for the NBFM modem (extracted from modem-gui in phase 2 of layered-arch)"

[dependencies]
modem-core = { path = "../modem-core" }
modem-framing = { path = "../modem-framing" }
modem-io = { path = "../modem-io" }
modem-sdr = { path = "../modem-sdr" }
modem-sdr-dsp = { path = "../modem-sdr-dsp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = { workspace = true }
zstd = "0.13"
serialport = "4"
cpal = "0.15"
# Journal bundles (gzip, readable with stock tools).
flate2 = "1"

# Thread / process CPU time for the journal.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
num-complex = { workspace = true }
rustfft = { workspace = true }
modem-core-base = { path = "../modem-core-base" }
